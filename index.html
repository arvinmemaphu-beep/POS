<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCFACO POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCFACO POS">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg: #14261F;
    --bg-panel: #1B3129;
    --bg-panel-2: #21382F;
    --ink: #F3EFE3;
    --ink-dim: #B9C7BE;
    --line: #33473D;
    --gold: #D9B65B;
    --gold-dim: #A88A3F;
    --red: #C1584A;
    --green: #6FA383;
    --on-accent: #1B2A20;
    --accent-hover: #E5C36B;
    --err-ink: #F0B3AB;
    --pos: #8fd39b;
    --neg: #e08a8a;
    --radius: 3px;
    color-scheme: dark;
  }
  /* ── COLOR THEMES: --gold is the accent colour. Green is the default (no data-theme). ── */
  :root[data-theme="blue"]{
    --bg:#0F1B2D; --bg-panel:#16263E; --bg-panel-2:#1C3050; --ink:#EAF1FB; --ink-dim:#A7B7CE; --line:#2B4364;
    --gold:#6FB1F2; --gold-dim:#4A88C4; --red:#E0685A; --green:#6CC29A;
    --on-accent:#0B1626; --accent-hover:#8CC4F7; --err-ink:#F5B7AF;
  }
  :root[data-theme="purple"]{
    --bg:#1B1428; --bg-panel:#251B38; --bg-panel-2:#2E2247; --ink:#F1EBFA; --ink-dim:#B8AACF; --line:#40315C;
    --gold:#C39BF0; --gold-dim:#9670C8; --red:#E06A7A; --green:#7FCFA0;
    --on-accent:#1B1428; --accent-hover:#D3B4F5; --err-ink:#F5B7C0;
  }
  :root[data-theme="red"]{
    --bg:#241214; --bg-panel:#301A1D; --bg-panel-2:#3B2225; --ink:#F8ECE8; --ink-dim:#CDB0AA; --line:#4E2E32;
    --gold:#F08A7C; --gold-dim:#C0605A; --red:#E2503F; --green:#7CC79A;
    --on-accent:#241214; --accent-hover:#F5A196; --err-ink:#F7BDB4;
  }
  :root[data-theme="orange"]{
    --bg:#241A0E; --bg-panel:#2F2213; --bg-panel-2:#3A2B19; --ink:#F8EFE0; --ink-dim:#CDBB9F; --line:#4F3D24;
    --gold:#F2A93B; --gold-dim:#BF8025; --red:#D9614F; --green:#86B87A;
    --on-accent:#241A0E; --accent-hover:#F6BC62; --err-ink:#F3B8AE;
  }
  :root[data-theme="dark"]{
    --bg:#0E0F11; --bg-panel:#1A1D21; --bg-panel-2:#23272D; --ink:#EDEFF2; --ink-dim:#A5ACB6; --line:#333943;
    --gold:#56C7D6; --gold-dim:#3A97A4; --red:#E0685A; --green:#6CC29A;
    --on-accent:#0B1A1D; --accent-hover:#7ED8E4; --err-ink:#F5B7AF;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#F2F4F3; --bg-panel:#FFFFFF; --bg-panel-2:#E8ECEA; --ink:#16211C; --ink-dim:#566259; --line:#D3DAD6;
    --gold:#1F6B4A; --gold-dim:#2F8A63; --red:#B3392C; --green:#22794F;
    --on-accent:#FFFFFF; --accent-hover:#185A3D; --err-ink:#8E2A20; --pos:#1E7A45; --neg:#B3392C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  .serif{ font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
  .mono{ font-variant-numeric: tabular-nums; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

  .app{ max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px; margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  header.top h1{
    font-size: 26px; font-weight: 600; margin:0; letter-spacing: 0.2px;
  }
  header.top .sub{ color: var(--ink-dim); font-size: 13px; margin-top: 4px; }

  nav.tabs{ display:flex; flex-wrap: wrap; gap: 4px 8px; justify-content: flex-end; max-width: 100%; }
  nav.tabs button{
    background:none; border:none; color: var(--ink-dim);
    font-size: clamp(15px, 4.2vw, 18px); font-weight: 500; padding: 9px clamp(9px, 2.8vw, 16px); cursor:pointer;
    border-bottom: 2px solid transparent; white-space: nowrap; flex: 0 1 auto;
  }
  nav.tabs button.active{ color: var(--gold); border-bottom-color: var(--gold); }
  nav.tabs button:hover{ color: var(--ink); }

  /* ── header right side: nav/user bar, theme button, burger ── */
  .hdr-right{ display:flex; align-items:flex-start; gap:8px; margin-left:auto; }
  .hdr-col{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .theme-wrap{ position:relative; }
  .theme-btn{
    background:none; border:1px solid var(--line); border-radius: var(--radius);
    color: var(--ink); font-size: 20px; line-height:1; padding: 8px 12px; cursor:pointer;
  }
  .theme-btn:active{ background: var(--bg-panel-2); }
  .theme-scrim{ display:none; position:fixed; inset:0; z-index:99; background:transparent; border:none; padding:0; }
  .theme-scrim.open{ display:block; }
  .theme-pop{
    display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:100; width:236px;
    background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius);
    padding:10px; box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  }
  .theme-pop.open{ display:block; }
  .theme-pop h3{ margin:2px 4px 2px; font-size:15px; font-weight:600; color: var(--ink); }
  .theme-pop .theme-note{ margin:0 4px 8px; font-size:12px; color: var(--ink-dim); }
  .theme-opt{
    display:flex; align-items:center; gap:12px; width:100%; min-height:44px;
    background:none; border:1px solid transparent; border-radius: var(--radius);
    color: var(--ink); font-size:16px; padding:6px 8px; cursor:pointer; text-align:left;
  }
  .theme-opt:hover{ background: var(--bg-panel-2); }
  .theme-opt.active{ border-color: var(--gold-dim); }
  .theme-opt > span:nth-child(2){ flex:1; }
  .theme-chip{
    display:inline-flex; align-items:flex-end; width:30px; height:30px; padding:5px;
    border:1px solid; border-radius: var(--radius); flex:none;
  }
  .theme-chip i{ display:block; width:100%; height:6px; border-radius:1px; }
  .theme-check{ visibility:hidden; color: var(--gold); font-weight:700; }
  .theme-opt.active .theme-check{ visibility:visible; }
  .theme-btn:focus-visible, .theme-opt:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ── MOBILE: hamburger menu ── */
  .burger{
    display:none; background:none; border:1px solid var(--line); border-radius: var(--radius);
    color: var(--ink); font-size: 20px; line-height:1; padding: 8px 12px; cursor:pointer;
  }
  .burger:active{ background: var(--bg-panel-2); }
  @media (max-width: 720px){
    .burger{ display:inline-block; }
    header.top{ align-items:center; }
    .hdr-right{ align-items:center; }
    .hdr-col{ display:contents; } /* nav drawer is position:fixed, so it still works */
    .user-bar{ display:none !important; } /* desktop user-bar itago sa mobile — nasa drawer na */
    nav.tabs{
      display:none; position:fixed; z-index:90;
      top:0; right:0; width:min(78vw, 320px); height:100vh; height:100dvh;
      flex-direction:column; justify-content:flex-start; align-items:stretch;
      gap:0; padding: 14px 0 90px; overflow-y:auto;
      background: var(--bg-panel); border-left:1px solid var(--line);
      box-shadow: -12px 0 32px rgba(0,0,0,0.45);
    }
    nav.tabs.open{ display:flex; }
    nav.tabs button{
      text-align:left; padding: 15px 22px; font-size:16px;
      border-bottom:none; border-left:3px solid transparent; border-radius:0;
    }
    nav.tabs button.active{ border-left-color: var(--gold); background: var(--bg-panel-2); }
    .scrim{
      display:none; position:fixed; inset:0; z-index:80;
      background: rgba(0,0,0,0.45); border:none; padding:0; cursor:pointer;
    }
    .scrim.open{ display:block; }
    .m-userbar{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      padding: 14px 22px 6px; border-top: 1px solid var(--line); margin-top: 10px;
      color: var(--ink-dim); font-size:12px;
    }
    .m-userbar button{ padding:5px 9px; }
  }
  @media (min-width: 721px){ .scrim, .m-userbar{ display:none !important; } }

  .status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .status-ok{ background: var(--green); }
  .status-bad{ background: var(--red); }
  .status-row{ font-size:12px; color: var(--ink-dim); display:flex; align-items:center; margin-top:4px; }

  .grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
  @media (max-width: 800px){ .grid{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .panel h2{ font-size: 15px; margin: 0 0 12px; color: var(--ink-dim); font-weight: 600; }

  .product-list{ display:flex; flex-direction:column; gap:1px; }
  .product-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 11px 4px; border-bottom: 1px solid var(--line);
    cursor:pointer;
  }
  .product-row:last-child{ border-bottom:none; }
  .product-row:hover{ background: var(--bg-panel-2); }
  .product-row .name{ font-size: 14.5px; }
  .product-row .meta{ font-size: 12px; color: var(--ink-dim); margin-top:2px; }
  .stock-num{ font-size: 16px; font-weight: 700; color: var(--gold); }
  .stock-num.stock-low{ color: var(--red); }
  .stock-callout{ font-size: 20px; font-weight: 700; color: var(--gold); margin-top: 4px; }
  .stock-callout.stock-low{ color: var(--red); }
  .product-row .price{ font-size: 15px; color: var(--gold); }

  .cart-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0; border-bottom: 1px solid var(--line); gap:8px;
  }
  .cart-row .name{ font-size:14px; flex:1; }
  .qty-controls{ display:flex; align-items:center; gap:6px; }
  .qty-controls button{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--ink); cursor:pointer; font-size:13px; line-height:1;
  }
  .cart-total{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--gold-dim);
  }
  .cart-total .amt{ font-size: 24px; color: var(--gold); }

  button.primary{
    width:100%; margin-top:14px; padding: 11px; border:none; border-radius: var(--radius);
    background: var(--gold); color: var(--on-accent); font-weight:600; font-size:14px; cursor:pointer;
  }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; }
  button.primary:hover:not(:disabled){ background: var(--accent-hover); }

  button.ghost{
    background:none; border:1px solid var(--line); color: var(--ink-dim);
    padding:7px 12px; border-radius: var(--radius); cursor:pointer; font-size:13px;
  }
  button.ghost:hover{ color: var(--ink); border-color: var(--ink-dim); }

  input, .field-input{
    width:100%; background: var(--bg); border:1px solid var(--line); color: var(--ink);
    padding: 9px 10px; border-radius: var(--radius); font-size: 14px; font-family: inherit;
  }
  input:focus{ outline:none; border-color: var(--gold-dim); }
  label{ font-size:12px; color: var(--ink-dim); display:block; margin-bottom:4px; }
  .field{ margin-bottom:12px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }

  .empty{ color: var(--ink-dim); font-size:13px; padding: 20px 4px; text-align:center; }

  .sale-row{
    padding: 12px 4px; border-bottom: 1px solid var(--line);
  }
  .sale-row .head{ display:flex; justify-content:space-between; font-size:14px; }
  .sale-row .items{ color: var(--ink-dim); font-size:12.5px; margin-top:4px; }
  .sale-row .amt{ color: var(--gold); }

  .toast{
    position: fixed; bottom: 20px; left:50%; transform: translateX(-50%);
    background: var(--bg-panel-2); border:1px solid var(--line); color: var(--ink);
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .toast.err{ border-color: var(--red); color: var(--err-ink); }

  .setup-note{
    font-size: 12.5px; color: var(--ink-dim); line-height:1.6; margin-top: 10px;
  }
  .auth-shell{ display:flex; justify-content:center; padding-top:24px; }
  .auth-card{ width:min(100%, 440px); }
  .auth-card h2{ color:var(--ink); }
  .auth-error{ color:var(--err-ink); border:1px solid var(--red); padding:10px; margin-top:12px; font-size:13px; line-height:1.45; }
  .user-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; color:var(--ink-dim); font-size:12px; }
  .role-badge{ display:inline-block; border:1px solid var(--gold-dim); color:var(--gold); border-radius:10px; padding:2px 8px; text-transform:capitalize; }
  .setup-note code{
    background: var(--bg); padding: 1px 5px; border-radius: 2px; color: var(--gold);
  }
  a{ color: var(--gold); }

  .del-x{ color: var(--red); cursor:pointer; font-size:12px; margin-left:8px; }
  .icon-btn{ background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px; padding:2px 6px; }
  .icon-btn:hover{ color: var(--red); }

  .qty-input{ width:56px; text-align:center; padding:5px 4px; font-size:13px; }
  .strike{ text-decoration:line-through; opacity:0.75; }
  .num-sm{ width:70px; padding:5px 6px; font-size:13px; text-align:center; }
  .tag{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); color:var(--ink-dim); }
  .tag.open{ border-color: var(--gold-dim); color: var(--gold); }
  .tag.closed{ border-color: var(--green); color: var(--green); }
  .cons-item{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .cons-item:last-child{ border-bottom:none; }
  .cons-item .nm{ flex:1; min-width:130px; }
  .cons-item .sub{ color:var(--ink-dim); font-size:11.5px; margin-top:2px; }
  select{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    padding:9px 10px; border-radius:var(--radius); font-size:14px; font-family:inherit; }
  select:focus{ outline:none; border-color: var(--gold-dim); }
  .nav-group{ position:relative; display:flex; }
  .nav-sub{
    display:none; position:absolute; top:100%; right:0; z-index:95; min-width:170px; flex-direction:column;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(0,0,0,0.35); padding:4px 0;
  }
  .nav-group.open .nav-sub{ display:flex; }
  nav.tabs .nav-sub button{ text-align:left; width:100%; padding:11px 18px; font-size:16px; border-bottom:none; border-left:3px solid transparent; border-radius:0; }
  nav.tabs .nav-sub button.active{ border-left-color:var(--gold); background:var(--bg-panel-2); }
  @media (max-width: 720px){
    .nav-group{ flex-direction:column; align-items:stretch; }
    .nav-sub{ position:static; min-width:0; border:none; box-shadow:none; background:transparent; padding:0; }
    nav.tabs .nav-sub button{ padding:13px 22px 13px 40px; }
  }
  .rc-svg{ width:100%; height:auto; display:block; }
  .rc-grid{ stroke:var(--line); stroke-width:1; }
  .rc-bar{ fill:var(--gold); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rc-neg .rpt-share > div{ background:var(--neg, var(--red)); }
  .rc-bar2{ fill:var(--neg, var(--red)); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rc-legend{ display:flex; gap:16px; font-size:12px; color:var(--ink-dim); margin:0 0 4px; }
  .rc-legend .sw{ display:inline-block; width:10px; height:10px; margin-right:5px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rpt-tbl{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; }
  .rpt-tbl th, .rpt-tbl td{ padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  .rpt-tbl th:first-child, .rpt-tbl td:first-child{ text-align:left; }
  .rpt-tbl th{ color:var(--ink-dim); font-weight:600; }
  .rpt-tbl tr.tot td{ font-weight:700; }
  .rc-dim{ opacity:0.4; }
  .rc-hit{ fill:transparent; cursor:pointer; }
  .rc-txt{ fill:var(--ink-dim); font-size:11px; }
  .rpt-share{ height:6px; background:var(--bg-panel-2); margin-top:6px; }
  .rpt-share > div{ height:100%; background:var(--gold); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rpt-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; }
  .rpt-stat{ background:var(--bg-panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px; }
  .rpt-stat .lbl{ font-size:12px; color:var(--ink-dim); margin-bottom:4px; }
  .rpt-stat .val{ font-size:20px; color:var(--gold); }
  .rpt-bar{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px; }
  .rpt-bar .d{ width:52px; color:var(--ink-dim); }
  .rpt-bar .track{ flex:1; height:8px; background:var(--bg-panel-2); }
  .rpt-bar .fill{ height:100%; background:var(--gold); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rpt-bar .a{ width:96px; text-align:right; }
  .rpt-controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  .rpt-controls input{ width:auto; }
  @media print{
    :root[data-theme]{ --bg:#fff; --bg-panel:#fff; --bg-panel-2:#eee; --ink:#000; --ink-dim:#444; --line:#bbb; --gold:#000; --gold-dim:#555; }
    header.top, .no-print, .toast, .scrim, .burger{ display:none !important; }
    body{ background:#fff; }
  }
</style>
<script>
/* Color themes. Each person's pick is saved on their own device (localStorage).
   bg / panel / accent below are only for the little preview chips; the real colours are the CSS variables above. */
const THEMES = {
  green:  { label:'Green',  bg:'#14261F', panel:'#1B3129', accent:'#D9B65B' },
  blue:   { label:'Blue',   bg:'#0F1B2D', panel:'#16263E', accent:'#6FB1F2' },
  purple: { label:'Purple', bg:'#1B1428', panel:'#251B38', accent:'#C39BF0' },
  red:    { label:'Red',    bg:'#241214', panel:'#301A1D', accent:'#F08A7C' },
  orange: { label:'Orange', bg:'#241A0E', panel:'#2F2213', accent:'#F2A93B' },
  dark:   { label:'Dark',   bg:'#0E0F11', panel:'#1A1D21', accent:'#56C7D6' },
  light:  { label:'Light',  bg:'#F2F4F3', panel:'#FFFFFF', accent:'#1F6B4A' }
};
const THEME_KEY = 'pos-theme';
function currentTheme(){
  try{ const t = localStorage.getItem(THEME_KEY); if(t && THEMES[t]) return t; }catch(e){}
  return 'green';
}
function applyTheme(name, save){
  if(!THEMES[name]) name = 'green';
  document.documentElement.setAttribute('data-theme', name);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', THEMES[name].bg);
  if(save){ try{ localStorage.setItem(THEME_KEY, name); }catch(e){} }
  document.querySelectorAll('.theme-opt').forEach(b=> b.classList.toggle('active', b.dataset.themePick === name));
}
applyTheme(currentTheme(), false);
</script>

<div class="app" id="app"></div>

<script src="config.js"></script>

<script>
const supabaseConfig = window.SUPABASE_CONFIG || {};
const state = {
  tab: 'pos',
  supaUrl: supabaseConfig.url || '',
  supaKey: supabaseConfig.anonKey || '',
  session: null,
  user: null,
  role: null,
  loginEmail: '',
  authError: '',
  authLoading: false,
  connected: false,
  products: [],
  cart: [], // {id, name, price, qty}
  sales: [],
  saleItems: [],
  loading: false,
  toast: null,
  tendered: '',
  checkingOut: false,
  editing: null,        // {id, name, price} product being edited
  restockQty: '',
  consignments: [],
  consignDraft: [],     // {product_id, name, price, qty}
  consignee: '',
  consignNote: '',
  consignPick: '',
  consignPickQty: '',
  settle: {},           // item_id -> {sold, returned}
  busy: false,
  menuOpen: false,

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function showToast(msg, isErr){
  state.toast = {msg, isErr};
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 3200);
}

function money(n){
  return '\u20B1' + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function loadConfig(){
  try{
    const external = window.SUPABASE_CONFIG || {};
    if(external.url && external.anonKey){
      state.supaUrl = external.url;
      state.supaKey = external.anonKey;
    } else {
      const raw = localStorage.getItem('supabase-config');
      if(raw){
        const cfg = JSON.parse(raw);
        state.supaUrl = cfg.url || '';
        state.supaKey = cfg.key || '';
      }
    }
    const savedSession = sessionStorage.getItem('supa-session');
    if(savedSession) state.session = JSON.parse(savedSession);
  }catch(e){ /* no config or session yet */ }
}

async function saveConfig(){
  try{
    localStorage.setItem('supabase-config', JSON.stringify({url: state.supaUrl, key: state.supaKey}));
  }catch(e){ /* storage unavailable, config just won't persist */ }
}

async function saveSession(){
  try{
    if(state.session) sessionStorage.setItem('supa-session', JSON.stringify(state.session));
    else sessionStorage.removeItem('supa-session');
  }catch(e){ /* session storage unavailable */ }
}

function clearSession(){
  try{ sessionStorage.removeItem('supa-session'); }catch(e){ /* ignore */ }
}

function escapeHtml(value){
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;').replace(/'/g, '&#039;');
}

function supaHeaders(){
  return {
    'apikey': state.supaKey,
    'Authorization': 'Bearer ' + (state.session && state.session.access_token ? state.session.access_token : state.supaKey),
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}

async function testConnection(){
  if(!state.supaUrl || !state.supaKey || !state.session || !state.session.access_token){ state.connected = false; return false; }
  try{
    const res = await fetch(state.supaUrl + '/rest/v1/products?select=id&limit=1', { headers: supaHeaders() });
    state.connected = res.ok;
    return state.connected;
  }catch(e){
    state.connected = false;
    return false;
  }
}

async function fetchCurrentUser(){
  const res = await fetch(state.supaUrl + '/auth/v1/user', { headers: supaHeaders() });
  if(!res.ok) throw new Error('Your Supabase session has expired. Please sign in again.');
  state.user = await res.json();
}

async function loadProfile(){
  if(!state.user || !state.user.id) throw new Error('Could not identify the signed-in user.');
  const res = await fetch(state.supaUrl + '/rest/v1/profiles?select=role,full_name&user_id=eq.' + encodeURIComponent(state.user.id), { headers: supaHeaders() });
  if(!res.ok) throw new Error('Could not load your role profile. Run the role setup SQL in your Supabase SQL Editor first.');
  const rows = await res.json();
  const profile = rows[0];
  if(!profile || (profile.role !== 'admin' && profile.role !== 'cashier' && profile.role !== 'viewer')){
    throw new Error('No valid role is assigned to this account. Add this account to the profiles table as admin, cashier, or viewer in your Supabase SQL Editor.');
  }
  state.role = profile.role;
}

async function restoreAuth(){
  if(!state.session || !state.session.access_token) return false;
  try{
    await fetchCurrentUser();
    await loadProfile();
    const ok = await testConnection();
    if(ok){ await checkDiscountColumn(); await checkConsignMemberColumn(); await checkLedgerReady(); await checkLedgerDepositColumn(); await fetchProducts(); await fetchMembers(); }
    return ok;
  }catch(e){
    clearSession();
    state.session = null;
    state.user = null;
    state.role = null;
    state.connected = false;
    return false;
  }
}

async function login(email, password){
  if(!email || !password){ state.authError = 'Enter your email and password.'; render(); return; }
  state.authLoading = true;
  state.authError = '';
  render();
  let welcome = '';
  try{
    const res = await fetch(state.supaUrl + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{ 'apikey': state.supaKey, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const payload = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(payload.error_description || payload.msg || 'Sign in failed. Check your email and password.');
    state.session = payload;
    await saveSession();
    await fetchCurrentUser();
    await loadProfile();
    if(!await testConnection()) throw new Error('Signed in, but the POS tables could not be reached. Check your Supabase setup.');
    await checkDiscountColumn();
    await checkConsignMemberColumn();
    await checkLedgerReady();
    await checkLedgerDepositColumn();
    state.tab = 'pos';
    await fetchProducts();
    await fetchMembers();
    welcome = 'Signed in as ' + roleLabel() + '.';
  }catch(e){
    clearSession();
    state.session = null;
    state.user = null;
    state.role = null;
    state.connected = false;
    state.authError = e.message || 'Sign in failed.';
  }finally{
    state.authLoading = false;
    render();
  }
  if(welcome) showToast(welcome);
}

function logout(){
  clearSession();
  state.session = null;
  state.user = null;
  state.role = null;
  state.connected = false;
  state.tab = 'pos';
  state.cart = [];
  state.tendered = '';
  state.authError = '';
  state.members = [];
  state.editingMember = null;
  state.memberSearch = '';
  state.saleMemberId = '';
  state.consignMemberId = '';
  render();
}

function isAdmin(){ return state.role === 'admin'; }
function isViewer(){ return state.role === 'viewer'; }
function roleLabel(){ return isAdmin() ? 'Admin' : (isViewer() ? 'Regular' : 'Cashier'); }
function blockViewer(){
  if(isViewer()){ showToast('Regular users have view-only access.', true); return true; }
  return false;
}

function switchTab(tab){
  if(tab === 'settings' && !isAdmin()){
    showToast('Settings is available to Admin only.', true);
    return;
  }
  if(tab === 'report' && !canSeeReport()){
    showToast('The report is available to Admin and Regular users only.', true);
    return;
  }
  state.tab = tab;
  state.menuOpen = false;
  state.reportMenuOpen = false;
  render();
  if(tab === 'history') fetchSales();
  if(tab === 'items') fetchSaleItems();
  if(tab === 'consign') fetchConsignments();
  if(tab === 'ledger') fetchLedger();
  if(tab === 'report') fetchReport();
  if(tab === 'expenses') fetchExpenses();
  if(tab === 'members') fetchMembers();
  if(tab === 'settings') fetchAppUsers();
}

// Pulls the FULL sales history (not just the 50 shown on screen) and builds a
// downloadable .xlsx with a per-sale summary sheet and a per-product detail sheet.
// Pulls the FULL history from Supabase (not just what's shown on screen) and builds ONE
// downloadable .xlsx with everything: Sales, Sale Items, Consignments, and Consignment Items.
function sheetOrEmpty(rows, emptyNote){
  return XLSX.utils.json_to_sheet(rows.length ? rows : [{ Note: emptyNote }]);
}
async function exportHistoryToExcel(){
  if(!state.connected) return;
  const btn = document.getElementById('btn-export-excel');
  if(btn){ btn.disabled = true; btn.textContent = 'Exporting...'; }
  try{
    const [salesRes, consignRes] = await Promise.all([
      fetch(`${state.supaUrl}/rest/v1/sales?select=*,sale_items(product_name,price,qty)&order=created_at.desc`, { headers: supaHeaders() }),
      fetch(`${state.supaUrl}/rest/v1/consignments?select=*,consignment_items(*)&order=created_at.desc`, { headers: supaHeaders() })
    ]);
    if(!salesRes.ok) throw new Error('Failed to load sales');
    if(!consignRes.ok) throw new Error('Failed to load consignments');
    const sales = await salesRes.json();
    const consignments = await consignRes.json();
    if(sales.length === 0 && consignments.length === 0){ showToast('Wala pang data na i-eexport.', true); return; }

    const salesSummary = sales.map(s => {
      const d = new Date(s.created_at);
      const items = (s.sale_items || []).map(i => `${i.qty}x ${i.product_name}`).join(', ');
      return { Date: d.toLocaleDateString(), Time: d.toLocaleTimeString(), Items: items, Total: Number(s.total) };
    });

    const saleItemRows = [];
    sales.forEach(s => {
      const d = new Date(s.created_at);
      (s.sale_items || []).forEach(i => {
        saleItemRows.push({
          Date: d.toLocaleDateString(), Time: d.toLocaleTimeString(),
          Product: i.product_name, Qty: i.qty,
          'Unit Price': Number(i.price), Subtotal: Number(i.price) * Number(i.qty)
        });
      });
    });

    const consignSummary = consignments.map(c => {
      const d = new Date(c.created_at);
      const items = c.consignment_items || [];
      const member = c.member_id ? state.members.find(m=>m.id===c.member_id) : null;
      const sent = items.reduce((s,i)=> s + (i.qty_sent||0), 0);
      const sold = items.reduce((s,i)=> s + (i.qty_sold||0), 0);
      const returned = items.reduce((s,i)=> s + (i.qty_returned||0), 0);
      const soldValue = items.reduce((s,i)=> s + consignUnitPrice(i, c)*(i.qty_sold||0), 0);
      return {
        'Date Sent': d.toLocaleDateString(), Time: d.toLocaleTimeString(),
        Consignee: c.consignee, Member: member ? member.full_name : '',
        Status: c.status === 'closed' ? 'Settled' : 'Out',
        'Qty Sent': sent, 'Qty Sold': sold, 'Qty Returned': returned,
        'Sold Value': soldValue, Note: c.note || ''
      };
    });

    const consignItemRows = [];
    consignments.forEach(c => {
      const d = new Date(c.created_at);
      const member = c.member_id ? state.members.find(m=>m.id===c.member_id) : null;
      (c.consignment_items || []).forEach(i => {
        consignItemRows.push({
          'Date Sent': d.toLocaleDateString(), Time: d.toLocaleTimeString(),
          Consignee: c.consignee, Member: member ? member.full_name : '',
          Product: i.product_name, 'Qty Sent': i.qty_sent, Price: Number(i.price),
          'Qty Sold': i.qty_sold||0, 'Qty Returned': i.qty_returned||0,
          'Sold Value': consignUnitPrice(i, c) * (i.qty_sold||0),
          Status: c.status === 'closed' ? 'Settled' : 'Out'
        });
      });
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheetOrEmpty(salesSummary, 'No sales yet'), 'Sales Summary');
    XLSX.utils.book_append_sheet(wb, sheetOrEmpty(saleItemRows, 'No sale items yet'), 'Sale Items');
    XLSX.utils.book_append_sheet(wb, sheetOrEmpty(consignSummary, 'No consignments yet'), 'Consignments');
    XLSX.utils.book_append_sheet(wb, sheetOrEmpty(consignItemRows, 'No consignment items yet'), 'Consignment Items');
    XLSX.writeFile(wb, `CCFACO-Reports-${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('Excel report downloaded.');
  }catch(e){
    showToast('Could not export: ' + e.message, true);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Export to Excel'; }
}

function addToCart(product){
  if(blockViewer()) return;
  const existing = state.cart.find(c=>c.id===product.id);
  if(existing){ existing.qty += 1; }
  else{ state.cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 }); }
  render();
}

function changeQty(id, delta){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  item.qty = (Number(item.qty)||0) + delta;
  if(item.qty <= 0){ state.cart = state.cart.filter(c=>c.id!==id); }
  if(state.cart.length === 0){ state.tendered = ''; }
  render();
}

// Typed quantity: update numbers live without re-rendering (keeps focus in the input)
function setCartQty(id, raw){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  const n = Math.floor(Number(raw));
  item.qty = (raw === '' || isNaN(n) || n < 0) ? 0 : n;
  updateCartDisplay();
}

function commitCartQty(id){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  if(!item.qty || item.qty <= 0){ state.cart = state.cart.filter(c=>c.id!==id); }
  if(state.cart.length === 0){ state.tendered = ''; }
  render();
}

function updateCartDisplay(){
  for(const c of state.cart){
    const lineEl = document.querySelector(`[data-line="${c.id}"]`);
    if(lineEl) lineEl.textContent = money(lineTotal(c));
  }
  const totalEl = document.getElementById('cart-total-amt');
  if(totalEl) totalEl.textContent = money(cartTotal());
  updateChangeDisplay();
}

// Fixed discount per product: peso amount off per piece, assigned in the Products tab
function productDiscount(productId){
  const p = state.products.find(x=>x.id===productId);
  const n = p ? Number(p.discount) : 0;
  const base = p ? (Number(p.price) || 0) : 0;
  return (isNaN(n) || n <= 0) ? 0 : Math.min(n, base);
}

// the member price for a product, regardless of whether a sale is in progress — used for informational display (Products tab)
function memberPriceOf(p){
  return Math.round((p.price - productDiscount(p.id)) * 100) / 100;
}

// price per piece actually charged for a consignment item — the discount only applies if the consignment is tagged to a Member
function consignUnitPrice(item, consignment){
  if(!consignment.member_id) return item.price;
  return Math.round(Math.max(0, item.price - productDiscount(item.product_id)) * 100) / 100;
}

// price per piece actually charged in the cart — the discount only applies when a member is picked for this sale
function discountedUnitPrice(c){
  if(!state.saleMemberId) return c.price;
  return memberPriceOf(c);
}

function lineTotal(c){
  return discountedUnitPrice(c) * (Number(c.qty)||0);
}

function cartTotal(){
  return state.cart.reduce((sum,c)=> sum + lineTotal(c), 0);
}

function updateChangeDisplay(){
  const total = cartTotal();
  const tenderedNum = Number(state.tendered) || 0;
  const change = tenderedNum - total;
  const tenderedEntered = state.tendered !== '';
  const insufficientAmount = !tenderedEntered || tenderedNum < total;

  const changeEl = document.getElementById('change-amount');
  if(changeEl){
    changeEl.textContent = money(Math.max(change,0));
    changeEl.style.color = change < 0 ? 'var(--red)' : 'var(--green)';
  }
  const msgEl = document.getElementById('insufficient-msg');
  if(msgEl){
    msgEl.textContent = insufficientAmount ? (!tenderedEntered ? 'Enter the amount received before completing the sale.' : 'Amount received is less than the total.') : '';
  }
  const btn = document.getElementById('btn-checkout');
  if(btn){
    btn.disabled = insufficientAmount || state.checkingOut || state.cart.length===0;
  }
}

async function checkout(){
  if(blockViewer()) return;
  if(state.cart.length===0) return;
  if(state.checkingOut) return; // prevent double-submit from fast/repeated taps
  const total = cartTotal();
  const tenderedNum = Number(state.tendered) || 0;
  if(state.tendered === '' || tenderedNum < total){
    showToast('Enter a valid amount received (must cover the total).', true);
    return;
  }
  state.checkingOut = true;
  render();
  try{
    const saleRes = await fetch(`${state.supaUrl}/rest/v1/sales`, {
      method:'POST', headers: supaHeaders(),
      body: JSON.stringify([{ total }])
    });
    if(!saleRes.ok) throw new Error('Checkout failed');
    const saleRows = await saleRes.json();
    const saleId = saleRows[0].id;

    const itemRows = state.cart.map(c => ({
      sale_id: saleId,
      product_id: c.id,
      product_name: c.name,
      price: discountedUnitPrice(c),
      qty: c.qty
    }));
    const itemsRes = await fetch(`${state.supaUrl}/rest/v1/sale_items`, {
      method:'POST', headers: supaHeaders(),
      body: JSON.stringify(itemRows)
    });
    if(!itemsRes.ok) throw new Error('Failed to record sale items');

    for(const c of state.cart){
      const prod = state.products.find(p=>p.id===c.id);
      if(prod){
        const newStock = Math.max(0, (prod.stock||0) - c.qty);
        await fetch(`${state.supaUrl}/rest/v1/products?id=eq.${c.id}`, {
          method:'PATCH', headers: supaHeaders(),
          body: JSON.stringify({ stock: newStock })
        });
      }
    }
    state.cart = [];
    state.tendered = '';
    state.saleMemberId = '';
    await fetchProducts();
    const itemsSummary = itemRows.map(r => `${r.qty}x ${r.product_name}`).join(', ');
    await postSaleToLedger(saleId, total, itemsSummary);
    if(state.tab === 'ledger') await fetchLedger();
    showToast('Sale recorded — ' + money(total));
  }catch(e){
    showToast('Checkout failed: ' + e.message, true);
  }
  state.checkingOut = false;
  render();
}

async function restockProduct(id, addQty){

// Returns ledger entries in display order (oldest first) each tagged with its
// running balance, computed client-side: previous balance + in - out.
function ledgerWithBalances(){
  let bal = 0;
  return state.ledgerEntries.map(e => {
    bal += (Number(e.amount_in)||0) - (Number(e.amount_out)||0);
    return Object.assign({}, e, { balance: bal });
  });
}

function addConsignDraft(){
  if(blockViewer()) return;
  const p = state.products.find(x=>x.id===state.consignPick);
  const qty = Math.floor(Number(state.consignPickQty));
  if(!p){ showToast('Pick a product first.', true); return; }
  if(!qty || qty <= 0){ showToast('Enter how many pieces to send.', true); return; }
  const already = state.consignDraft.filter(d=>d.product_id===p.id).reduce((s,d)=>s+d.qty,0);
  if(qty + already > (p.stock||0)){ showToast('Only ' + (p.stock||0) + ' in stock for ' + p.name + '.', true); return; }
  const existing = state.consignDraft.find(d=>d.product_id===p.id);
  if(existing){ existing.qty += qty; }
  else{ state.consignDraft.push({ product_id: p.id, name: p.name, price: p.price, qty }); }
  state.consignPickQty = '';
  render();
}

function consignDraftTotal(){
  return state.consignDraft.reduce((s,d)=> s + d.price*d.qty, 0);
}

async function sendConsignment(){
  if(blockViewer()) return;
  if(state.busy) return;
  const consignee = state.consignee.trim();
  if(!consignee){ showToast('Enter who receives the items.', true); return; }
  if(state.consignDraft.length === 0){ showToast('Add at least one item.', true); return; }
  state.busy = true; render();
  try{
    const consignRow = { consignee, note: state.consignNote.trim() || null, status: 'open' };
    if(state.consignMemberCol && state.consignMemberId) consignRow.member_id = state.consignMemberId;
    const cRes = await fetch(`${state.supaUrl}/rest/v1/consignments`, {
      method:'POST', headers: supaHeaders(),
      body: JSON.stringify([consignRow])
    });
    if(!cRes.ok) throw new Error('Could not create consignment');
    const consignmentId = (await cRes.json())[0].id;

    const itemRows = state.consignDraft.map(d => ({
      consignment_id: consignmentId,
      product_id: d.product_id,
      product_name: d.name,
      price: d.price,
      qty_sent: d.qty,
      qty_sold: 0,
      qty_returned: 0
    }));
    const iRes = await fetch(`${state.supaUrl}/rest/v1/consignment_items`, {
      method:'POST', headers: supaHeaders(), body: JSON.stringify(itemRows)
    });
    if(!iRes.ok) throw new Error('Could not save consignment items');

    // items leave the shop, so take them out of stock
    for(const d of state.consignDraft){
      const prod = state.products.find(p=>p.id===d.product_id);
      if(prod) await setStock(d.product_id, (prod.stock||0) - d.qty);
    }

    state.consignDraft = [];
    state.consignee = '';
    state.consignNote = '';
    state.consignMemberId = '';
    await fetchProducts();
    await fetchConsignments();
    showToast('Consignment sent to ' + consignee + '.');
  }catch(e){
    showToast('Could not send consignment: ' + e.message, true);
  }
  state.busy = false; render();
}

async function settleConsignment(consignment){
  if(blockViewer()) return;
  if(state.busy) return;
  const items = consignment.consignment_items || [];
  const rows = [];
  for(const it of items){
    const s = state.settle[it.id] || {};
    const soldRaw = String(s.sold === undefined || s.sold === null ? '' : s.sold).trim();
    const retRaw = String(s.returned === undefined || s.returned === null ? '' : s.returned).trim();
    if(soldRaw === '' || retRaw === ''){
      showToast('Enter sold and returned quantities for ' + it.product_name + '.', true);
      return;
    }
    const sold = Math.floor(Number(soldRaw));
    const ret = Math.floor(Number(retRaw));
    if(isNaN(sold) || isNaN(ret)){
      showToast('Invalid quantity for ' + it.product_name + '.', true);
      return;
    }
    if(sold < 0 || ret < 0){ showToast('Quantities cannot be negative.', true); return; }
    if(sold + ret > it.qty_sent){
      showToast(it.product_name + ': sold + returned cannot be more than ' + it.qty_sent + ' sent.', true);
      return;
    }
    rows.push({ it, sold, ret });
  }
  const soldTotal = rows.reduce((s,r)=> s + consignUnitPrice(r.it, consignment)*r.sold, 0);
  state.busy = true; render();
  try{
    // record the sold pieces as a real sale so revenue reports stay correct
    if(soldTotal > 0){
      const saleRes = await fetch(`${state.supaUrl}/rest/v1/sales`, {
        method:'POST', headers: supaHeaders(), body: JSON.stringify([{ total: soldTotal }])
      });
      if(!saleRes.ok) throw new Error('Could not record the sale');
      const saleId = (await saleRes.json())[0].id;
      const saleItems = rows.filter(r=>r.sold>0).map(r=>({
        sale_id: saleId, product_id: r.it.product_id, product_name: r.it.product_name,
        price: consignUnitPrice(r.it, consignment), qty: r.sold
      }));
      const siRes = await fetch(`${state.supaUrl}/rest/v1/sale_items`, {
        method:'POST', headers: supaHeaders(), body: JSON.stringify(saleItems)
      });
      if(!siRes.ok) throw new Error('Could not record sale items');
    }

    for(const r of rows){
      const pRes = await fetch(`${state.supaUrl}/rest/v1/consignment_items?id=eq.${r.it.id}`, {
        method:'PATCH', headers: supaHeaders(),
        body: JSON.stringify({ qty_sold: r.sold, qty_returned: r.ret })
      });
      if(!pRes.ok) throw new Error('Could not update the tally');
      // returned pieces go back to shop stock
      if(r.ret > 0){
        const prod = state.products.find(p=>p.id===r.it.product_id);
        if(prod) await setStock(r.it.product_id, (prod.stock||0) + r.ret);
      }
    }

    const cRes = await fetch(`${state.supaUrl}/rest/v1/consignments?id=eq.${consignment.id}`, {
      method:'PATCH', headers: supaHeaders(),
      body: JSON.stringify({ status: 'closed', settled_at: new Date().toISOString() })
    });
    if(!cRes.ok) throw new Error('Could not close the consignment');

    state.settle = {};
    await fetchProducts();
    await fetchConsignments();
    showToast('Consignment settled \u2014 sold ' + money(soldTotal) + '.');
  }catch(e){
    showToast('Could not settle: ' + e.message, true);
  }
  state.busy = false; render();
}

async function createUser(email, password, fullName, role){
  if(!isAdmin()) return false;
  if(!email || !password){ showToast('Enter an email and password.', true); return false; }
  if(password.length < 6){ showToast('Password should be at least 6 characters.', true); return false; }
  state.userBusy = true; render();
  try{
    const signupRes = await fetch(`${state.supaUrl}/auth/v1/signup`, {
      method:'POST',
      headers: { 'apikey': state.supaKey, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const payload = await signupRes.json().catch(()=>({}));
    if(!signupRes.ok) throw new Error(payload.error_description || payload.msg || payload.error || 'Could not create the account.');
    const newUserId = (payload.user && payload.user.id) || payload.id;
    if(!newUserId) throw new Error('Account created, but no user id came back. Check Supabase Authentication to confirm.');
    const profRes = await fetch(`${state.supaUrl}/rest/v1/profiles`, {
      method:'POST', headers: supaHeaders(),
      body: JSON.stringify([{ user_id: newUserId, full_name: fullName || null, role, email }])
    });
    if(!profRes.ok){
      const errBody = await profRes.json().catch(()=>({}));
      throw new Error(errBody.message || errBody.hint || 'Account created, but could not save the role. Add it in the profiles table manually.');
    }
    showToast('User added as ' + roleDisplay(role) + '.');
    await fetchAppUsers();
    return true;
  }catch(e){
    showToast('Could not add user: ' + e.message, true);
    return false;
  }finally{
    state.userBusy = false; render();
  }
}

create or replace function public.current_user_role()
returns text
language sql
stable
security definer
set search_path = public
as 'select role from public.profiles where user_id = auth.uid();';

function renderPOS(){
  const memberActive = !!state.saleMemberId;
  const rows = state.products.map(p => {
    const disc = (state.discountCol && memberActive) ? productDiscount(p.id) : 0;
    const priceHtml = disc > 0
      ? '<span class="strike">' + money(p.price) + '</span> ' + money(discountedUnitPrice(p))
      : money(p.price);
    const discMeta = disc > 0 ? ' · ' + money(disc) + ' off' : '';
    return `
    <div class="product-row" data-id="${p.id}">
      <div>
        <div class="name">${p.name}</div>
        <div class="meta"><span class="stock-num${p.stock<=5?' stock-low':''}">${p.stock}</span> in stock${discMeta}</div>
      </div>
      <div class="price mono">${priceHtml}</div>
    </div>`;
  }).join('') || `<div class="empty">No products yet. Add some in the Products tab.</div>`;

  const cartRows = state.cart.map(c => `
    <div class="cart-row">
      <div class="name">${c.name}</div>
      <div class="qty-controls">
        <button data-dec="${c.id}">\u2212</button>
        <input class="qty-input mono" data-qty="${c.id}" type="number" min="0" step="1" inputmode="numeric" value="${c.qty}">
        <button data-inc="${c.id}">+</button>
      </div>
      <div class="mono" data-line="${c.id}" style="width:70px; text-align:right;">${money(lineTotal(c))}</div>
    </div>
  `).join('') || `<div class="empty">Cart is empty. Tap a product to add it.</div>`;

  const total = cartTotal();
  const tenderedNum = Number(state.tendered) || 0;
  const change = tenderedNum - total;
  const hasCart = state.cart.length > 0;
  const tenderedEntered = state.tendered !== '';
  const insufficientAmount = hasCart && (!tenderedEntered || tenderedNum < total);
  const canCheckout = hasCart && !state.checkingOut && !insufficientAmount;

  return `
  <div class="grid">
    <div class="panel">
      <h2>Products</h2>
      <div class="product-list">${rows}</div>
    </div>
    <div class="panel">
      <h2>Current sale</h2>
      <div class="field">
        <label>Buyer</label>
        <select id="in-sale-member">
          <option value="">Walk-in (no discount)</option>
          ${state.members.map(m => `<option value="${m.id}" ${state.saleMemberId===m.id?'selected':''}>${escapeHtml(m.full_name)}</option>`).join('')}
        </select>
      </div>
      <div>${cartRows}</div>
      <div class="cart-total">
        <span>Total</span>
        <span class="amt mono" id="cart-total-amt">${money(total)}</span>
      </div>
      ${hasCart ? `
      <div class="field" style="margin-top:14px;">
        <label>Amount received</label>
        <input id="in-tendered" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${state.tendered}">
      </div>
      <div class="cart-total" style="border-top:none; padding-top:0; margin-top:0;">
        <span>Change (sukli)</span>
        <span class="amt mono" id="change-amount" style="color:${change < 0 ? 'var(--red)' : 'var(--green)'};">${money(Math.max(change,0))}</span>
      </div>
      <div id="insufficient-msg" style="color:var(--red); font-size:12.5px; margin-top:8px;">${insufficientAmount ? (!tenderedEntered ? 'Enter the amount received before completing the sale.' : 'Amount received is less than the total.') : ''}</div>
      ` : ''}
      <button class="primary" id="btn-checkout" ${!canCheckout?'disabled':''}>${state.checkingOut ? 'Saving...' : 'Complete sale'}</button>
    </div>
  </div>`;
}

function productDiscountLabel(p){
  const d = productDiscount(p.id);
  return d > 0 ? ' \u00B7 ' + money(d) + ' off' : '';
}

function renderProducts(){
  const rows = state.products.map(p =>     '<div class="product-row" data-edit="' + p.id + '" style="' + (isViewer() ? 'cursor:default;' : '') + '">' +
      '<div><div class="name">' + p.name + '</div><div class="meta"><span class="stock-num' + (p.stock<=5?' stock-low':'') + '">' + p.stock + '</span> in stock' + (state.discountCol ? productDiscountLabel(p) : '') + '</div></div>' +
      '<div style="display:flex; align-items:center; gap:10px;"><div class="price mono">' + (state.discountCol && productDiscount(p.id) > 0 ? '<span class="strike">' + money(p.price) + '</span> ' + money(memberPriceOf(p)) : money(p.price)) + '</div>' +
      (isViewer() ? '' : (isAdmin() ? '<button class="icon-btn" data-del="' + p.id + '" title="Delete">\u2715</button>' : '')) + '</div></div>'
  ).join('') || '<div class="empty">No products yet.</div>';

  const ed = state.editing;

  const leftPanel = isViewer() ?
    '<h2>Products</h2><div class="setup-note">Regular access is view-only. Product details can be reviewed, but products and stock cannot be changed.</div>' :
    (ed ?
      '<h2>Edit ' + ed.name + '</h2>' +
      '<div class="field"><label>Name</label><input id="ep-name" value="' + ed.name + '"></div>' +
      '<div class="field"><label>Price</label><input id="ep-price" type="number" step="0.01" value="' + ed.price + '"></div>' +
      (state.discountCol ? '<div class="field"><label>Discount (₱ off per piece)</label><input id="ep-disc" type="number" min="0" step="0.01" placeholder="0" value="' + (ed.discount || 0) + '"></div>' : '') +
      '<button class="primary" id="btn-save-product">Save changes</button>' +
      '<div style="border-top:1px solid var(--line); margin:18px 0 14px;"></div>' +
      '<h2>Restock</h2>' +
      '<div class="meta" style="font-size:12px; color:var(--ink-dim); margin-bottom:10px;">Current stock: <span class="mono">' + (current ? current.stock : 0) + '</span>. Stock goes down automatically on every sale.</div>' +
      '<div class="row2"><div class="field"><label>Add pieces</label><input id="rs-qty" type="number" min="1" step="1" placeholder="0" value="' + state.restockQty + '"></div>' +
      '<div class="field"><label>&nbsp;</label><button class="ghost" id="btn-restock" style="width:100%; padding:9px;">Add to stock</button></div></div>' +
      '<button class="ghost" id="btn-cancel-edit" style="width:100%;">Done</button>' :
      '<h2>Add a product</h2>' +
      '<div class="field"><label>Name</label><input id="np-name" placeholder="e.g. Band shirt"></div>' +
      '<div class="row2"><div class="field"><label>Price</label><input id="np-price" type="number" step="0.01" placeholder="0.00"></div>' +
      '<div class="field"><label>Starting stock</label><input id="np-stock" type="number" placeholder="0"></div></div>' +
      (state.discountCol ? '<div class="field"><label>Discount (₱ off per piece)</label><input id="np-disc" type="number" min="0" step="0.01" placeholder="0"></div>' : '') +
      '<button class="primary" id="btn-add-product">Add product</button>');

  return '<div class="grid"><div class="panel">' + leftPanel + '</div><div class="panel">' +
    '<h2>All products <span style="font-weight:400; color:var(--ink-dim);">— ' + (isViewer() ? 'view only' : 'tap one to edit or restock') + '</span></h2>' +
    '<div class="product-list">' + rows + '</div></div></div>';
}

      </div>
      <div class="items" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>${escapeHtml(e.details)}${Number(e.amount_in)>0 ? ' \u00B7 <span style="color:var(--pos);">+' + money(e.amount_in) + '</span>' : ''}${Number(e.amount_out)>0 ? ' \u00B7 <span style="color:var(--neg);">-' + money(e.amount_out) + '</span>' : ''}</span>
        ${(isAdmin() && state.ledgerDepositCol && Number(e.amount_out) > 0) ? `<button class="icon-btn" data-toggle-deposit="${e.id}" data-deposit-now="${e.is_deposit ? '1' : '0'}" title="${e.is_deposit ? 'Unmark as deposit' : 'Mark as cash deposit (exclude from Expense Report)'}">${e.is_deposit ? '\u2713' : '\u270E'}</button>` : ''}
      </div>
    </div>`;
  }).join('') || `<div class="empty">No ledger entries yet.</div>`;

  return `
  <div class="grid">
    <div class="panel">
      ${addForm}
    </div>
    <div class="panel">
      <h2 style="display:flex; align-items:center; justify-content:space-between;">

        <span class="amt mono">${money(currentBalance)}</span>
      </h2>
      <div class="setup-note" style="margin-bottom:10px;">Awtomatikong pumapasok dito ang bawat Sale (\u201cin\u201d). Manual na idinadagdag ang ibang items \u2014 bills, salary, atbp. Running balance: nakaraang balance + In \u2212 Out.</div>
      ${listRows}
    </div>
  </div>`;
}

/* ---------- Monthly sales report ---------- */
// Consignment sales are already saved as normal sales when a consignment is settled,
// so this report is built from the sales + sale_items tables and nothing is double counted.
function canSeeReport(){ return true; } // Report tab is visible to every role
function defaultReportMonth(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function reportRange(){
  const parts = (state.reportMonth || defaultReportMonth()).split('-').map(Number);
  return { y: parts[0], m: parts[1], start: new Date(parts[0], parts[1]-1, 1), end: new Date(parts[0], parts[1], 1) };
}
function reloadReportTab(){
  if(state.tab === 'expenses'){
    if(!state.salesYear || state.salesYear.year !== reportRange().y) fetchExpenses(); else render();
  }else fetchReport();
}
// Sales totals (only created_at + total) for a whole year, split per month and per day. Used by the charts on both reports.
async function loadSalesYear(y){
  const ys = encodeURIComponent(new Date(y, 0, 1).toISOString()), ye = encodeURIComponent(new Date(y + 1, 0, 1).toISOString());
  const months = new Array(12).fill(0), days = {}, step = 1000;
  for(let from = 0; ; from += step){
    const res = await fetch(`${state.supaUrl}/rest/v1/sales?select=created_at,total&created_at=gte.${ys}&created_at=lt.${ye}&order=created_at.asc`,
      { headers: Object.assign({}, supaHeaders(), { 'Range-Unit':'items', 'Range': `${from}-${from+step-1}` }) });
    if(!res.ok) throw new Error('Failed to load yearly sales');
    const rows = await res.json();
    rows.forEach(x=>{
      const d = new Date(x.created_at), t = Number(x.total) || 0, k = (d.getMonth() + 1) + '-' + d.getDate();
      months[d.getMonth()] += t;
      days[k] = (days[k] || 0) + t;
    });
    if(rows.length < step) break;
  }
  return { year: y, months, days };
}
// Every ledger entry that has an Out amount (all time), excluding cash deposits (see Settings SQL);
// the reports filter by month/year in the browser.
async function loadExpenseEntries(){
  const all = [], step = 1000;
  for(let from = 0; ; from += step){
    const res = await fetch(`${state.supaUrl}/rest/v1/ledger_entries?select=*&amount_out=gt.0&order=created_at.asc`,
      { headers: Object.assign({}, supaHeaders(), { 'Range-Unit':'items', 'Range': `${from}-${from+step-1}` }) });
    if(!res.ok) throw new Error('Failed to load expenses');
    const rows = await res.json();
    all.push(...rows);
    if(rows.length < step) break;
  }
  return all.filter(e => !e.is_deposit);
}
function shiftReportMonth(delta){
  const r = reportRange();
  const d = new Date(r.y, r.m-1+delta, 1);
  state.reportMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  reloadReportTab();
}
async function fetchReport(){
  if(!state.connected) return;
  if(!state.reportMonth) state.reportMonth = defaultReportMonth();
  const token = state.reportMonth;
  const r = reportRange();
  const range = (col)=> `${col}=gte.${encodeURIComponent(r.start.toISOString())}&${col}=lt.${encodeURIComponent(r.end.toISOString())}`;
  state.reportLoading = true; render();
  try{
    const all = [];
    const step = 1000;
    for(let from = 0; ; from += step){
      const res = await fetch(`${state.supaUrl}/rest/v1/sales?select=created_at,total,sale_items(product_name,price,qty)&${range('created_at')}&order=created_at.asc`,
        { headers: Object.assign({}, supaHeaders(), { 'Range-Unit':'items', 'Range': `${from}-${from+step-1}` }) });
      if(!res.ok) throw new Error('Failed to load sales');
      const rows = await res.json();
      all.push(...rows);
      if(rows.length < step) break;
    }
    let consign = [];
    try{
      const cRes = await fetch(`${state.supaUrl}/rest/v1/consignments?select=*,consignment_items(*)&status=eq.closed&${range('settled_at')}`, { headers: supaHeaders() });
      if(cRes.ok) consign = await cRes.json();
    }catch(e){ /* consignment note is optional */ }
    let salesYear = null, expenses = state.expenseEntries;
    try{ salesYear = await loadSalesYear(r.y); }catch(e){ /* the year chart is optional */ }
    if(state.ledgerReady){ try{ expenses = await loadExpenseEntries(); }catch(e){ /* expenses are optional here */ } }
    if(token !== state.reportMonth) return; // month changed while loading
    state.salesYear = salesYear;
    state.reportYearTotals = salesYear ? salesYear.months : [];
    state.expenseEntries = expenses;
    state.reportSales = all;
    state.reportConsign = consign;
  }catch(e){
    showToast('Could not load report: ' + e.message, true);
  }
  state.reportLoading = false; render();
}
function computeReport(){
  const days = {}, prods = {};
  let total = 0;
  state.reportSales.forEach(s=>{
    const t = Number(s.total) || 0;
    total += t;
    const day = new Date(s.created_at).getDate();
    days[day] = (days[day] || 0) + t;
    (s.sale_items || []).forEach(i=>{
      const name = (i.product_name || '').trim() || '(no name)';
      const key = name.toLowerCase();
      const p = prods[key] || (prods[key] = { name, qty:0, revenue:0 });
      const q = Number(i.qty) || 0;
      p.qty += q;
      p.revenue += (Number(i.price) || 0) * q;
    });
  });
  const count = state.reportSales.length;
  const products = Object.values(prods).sort((a,b)=> b.revenue - a.revenue);
  let bestDay = null;
  Object.keys(days).forEach(d=>{ if(!bestDay || days[d] > days[bestDay]) bestDay = d; });
  const consignValue = state.reportConsign.reduce((sum,c)=>
    sum + (c.consignment_items || []).reduce((x,i)=> x + consignUnitPrice(i, c) * (i.qty_sold || 0), 0), 0);
  return { total, count, avg: count ? total / count : 0, days, products, bestDay, consignCount: state.reportConsign.length, consignValue };
}
function reportMonthLabel(){
  const r = reportRange();
  return new Date(r.y, r.m-1, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
}
function niceCeil(v){
  if(v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;
}
function compactNum(n){ return n >= 1000 ? (Math.round(n / 100) / 10) + 'k' : String(Math.round(n)); }
function hasSeries(o){ return !!o && Object.values(o).some(v => v > 0); }
function chartLegend(){
  return '<div class="rc-legend"><span><i class="sw" style="background:var(--gold)"></i>Sales</span><span><i class="sw" style="background:var(--neg, var(--red))"></i>Expenses</span></div>';
}
function chartGrid(top, W, L, R, T, plotH){
  let g = '';
  for(let i = 0; i <= 4; i++){
    const yy = T + plotH - plotH * i / 4;
    g += `<line class="rc-grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="rc-txt" x="${L-6}" y="${yy+4}" text-anchor="end">${compactNum(top * i / 4)}</text>`;
  }
  return g;
}
function chartSeries(sales, exp){
  const S = [];
  if(hasSeries(sales)) S.push({ data: sales, cls: 'rc-bar', name: 'Sales' });
  if(hasSeries(exp)) S.push({ data: exp, cls: 'rc-bar2', name: 'Expenses' });
  return S;
}
// Column chart for EVERY day of the month. Sales in gold, expenses in red; either one may be null. Inline SVG.
function dailyChartSvg(sales, exp, y, m, label){
  const N = new Date(y, m, 0).getDate();
  const W = 640, H = 230, L = 46, R = 8, T = 10, B = 26;
  const plotW = W - L - R, plotH = H - T - B, slot = plotW / N;
  const S = chartSeries(sales, exp), both = S.length === 2;
  const top = niceCeil(Math.max(0, ...S.map(s => Math.max(0, ...Object.values(s.data)))));
  const mon = new Date(y, m-1, 1).toLocaleDateString(undefined, { month:'short' });
  const groupW = slot * 0.8, bw = groupW / Math.max(1, S.length);
  let g = chartGrid(top, W, L, R, T, plotH);
  for(let d = 1; d <= N; d++){
    const cx = L + slot * (d - 0.5);
    S.forEach((s, i)=>{
      const v = s.data[d] || 0;
      if(v > 0){
        const h = Math.max(2, v / top * plotH);
        g += `<rect class="${s.cls}" x="${cx - groupW/2 + i * bw}" y="${T + plotH - h}" width="${bw}" height="${h}" rx="1"><title>${mon} ${d}${both ? ' ' + s.name : ''}: ${money(v)}</title></rect>`;
      }
    });
    if(d === 1 || d % 5 === 0) g += `<text class="rc-txt" x="${cx}" y="${H - 8}" text-anchor="middle">${d}</text>`;
  }
  return `<svg class="rc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label || 'Daily'} chart">${g}</svg>`;
}
// Column chart for each month Jan..Dec of one year; the picked month is highlighted, tap a column to open that month.
function monthlyChartSvg(sales, exp, y, selM, label){
  const W = 640, H = 230, L = 46, R = 8, T = 18, B = 26;
  const plotW = W - L - R, plotH = H - T - B, slot = plotW / 12;
  const S = chartSeries(sales, exp), both = S.length === 2;
  const top = niceCeil(Math.max(0, ...S.map(s => Math.max(0, ...s.data))));
  const groupW = slot * 0.8, bw = groupW / Math.max(1, S.length);
  let g = chartGrid(top, W, L, R, T, plotH);
  for(let i = 0; i < 12; i++){
    const cx = L + slot * (i + 0.5);
    const name = new Date(y, i, 1).toLocaleDateString(undefined, { month:'short' });
    const key = y + '-' + String(i + 1).padStart(2, '0');
    const dim = i + 1 === selM ? '' : ' rc-dim';
    S.forEach((s, k)=>{
      const v = s.data[i] || 0;
      if(v > 0){
        const h = Math.max(2, v / top * plotH), x = cx - groupW / 2 + k * bw;
        g += `<rect class="${s.cls}${dim}" x="${x}" y="${T + plotH - h}" width="${bw}" height="${h}" rx="1"/>`;
        if(!both) g += `<text class="rc-txt" x="${cx}" y="${T + plotH - h - 4}" text-anchor="middle">${compactNum(v)}</text>`;
      }
    });
    const tip = S.map(s => (both ? s.name + ' ' : '') + money(s.data[i] || 0)).join(', ');
    g += `<text class="rc-txt" x="${cx}" y="${H - 8}" text-anchor="middle"${i + 1 === selM ? ' style="font-weight:700"' : ''}>${name}</text>` +
         `<rect class="rc-hit" data-rpt-month="${key}" x="${cx - slot/2}" y="${T}" width="${slot}" height="${plotH + B}"><title>${name} ${y}: ${tip}</title></rect>`;
  }
  return `<svg class="rc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label || 'Monthly'} chart">${g}</svg>`;
}
// Month-by-month block for a year: heading, legend, chart, and (when both sales and expenses exist) a Sales / Expenses / Net table.
function yearCompareBlock(sales, exp, y, m){
  const hs = hasSeries(sales), he = hasSeries(exp), both = hs && he;
  if(!hs && !he) return '';
  const title = both ? 'Sales and expenses by month' : (he ? 'Expenses by month' : 'Sales by month');
  const sTot = hs ? sales.reduce((a, b) => a + b, 0) : 0, eTot = he ? exp.reduce((a, b) => a + b, 0) : 0;
  const netColor = v => v >= 0 ? 'var(--pos, var(--green))' : 'var(--neg, var(--red))';
  let table = '';
  if(both){
    const rows = [];
    for(let i = 0; i < 12; i++){
      const a = sales[i] || 0, b = exp[i] || 0;
      if(!a && !b) continue;
      rows.push(`<tr><td>${new Date(y, i, 1).toLocaleDateString(undefined, { month:'short' })}</td><td class="mono">${money(a)}</td><td class="mono">${money(b)}</td><td class="mono" style="color:${netColor(a - b)}">${money(a - b)}</td></tr>`);
    }
    rows.push(`<tr class="tot"><td>${y}</td><td class="mono">${money(sTot)}</td><td class="mono">${money(eTot)}</td><td class="mono" style="color:${netColor(sTot - eTot)}">${money(sTot - eTot)}</td></tr>`);
    table = `<div style="overflow-x:auto;"><table class="rpt-tbl"><thead><tr><th>Month</th><th>Sales</th><th>Expenses</th><th>Net</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  }
  const note = both ? `Net = sales minus expenses. It is not profit, because product costs are not tracked. ` : `Year total: ${money(hs ? sTot : eTot)}. `;
  return `<h2>${title}, ${y}</h2>${both ? chartLegend() : ''}<div>${monthlyChartSvg(sales, exp, y, m, title)}</div>${table}<div class="setup-note" style="margin:6px 0 16px;">${note}Tap a month in the chart to open its report.</div>`;
}
function salesMonthDays(){
  const r = reportRange(), sy = state.salesYear;
  if(!sy || sy.year !== r.y) return null;
  const out = {};
  Object.keys(sy.days).forEach(k=>{ const p = k.split('-'); if(Number(p[0]) === r.m) out[Number(p[1])] = sy.days[k]; });
  return out;
}
function netStatBox(net, otherLabel){
  const col = net >= 0 ? 'var(--pos, var(--green))' : 'var(--neg, var(--red))';
  return `<div class="rpt-stat"><div class="lbl">Net (sales minus expenses)</div><div class="val mono" style="color:${col}">${money(net)}</div><div class="lbl" style="margin:2px 0 0;">${otherLabel}</div></div>`;
}

function renderReport(){
  const label = reportMonthLabel();
  const r = reportRange();
  const c = computeReport();
  const ex = state.ledgerReady ? computeExpenses() : null;
  const dEx = ex && hasSeries(ex.days) ? ex.days : null;
  const shortMonth = new Date(r.y, r.m-1, 1).toLocaleDateString(undefined, { month:'short' });

  ).join('');
  const yearBlock = yearCompareBlock(state.reportYearTotals.length ? state.reportYearTotals : null, ex ? ex.months : null, r.y, r.m);

      <div class="rpt-stat"><div class="lbl">Average per sale</div><div class="val mono">${money(c.avg)}</div></div>
      <div class="rpt-stat"><div class="lbl">Best day</div><div class="val mono">${c.bestDay ? shortMonth + ' ' + c.bestDay : '-'}</div><div class="lbl" style="margin:2px 0 0;">${c.bestDay ? money(c.days[c.bestDay]) : ''}</div></div>

    <h2>${dEx ? 'Sales and expenses per day' : 'Sales per day'}</h2>
