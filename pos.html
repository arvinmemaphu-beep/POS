<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCFACO POS</title>
<style>
  :root{
    --bg: #14261F;
    --bg-panel: #1B3129;
    --bg-panel-2: #21382F;
    --ink: #F3EFE3;
    --ink-dim: #B9C7BE;
    --line: #33473D;
    --gold: #D9B65B;
    --gold-dim: #A88A3F;
    --red: #C1584A;
    --green: #6FA383;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
  }
  .serif{ font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
  .mono{ font-variant-numeric: tabular-nums; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

  .app{ max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px; margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  header.top h1{
    font-size: 26px; font-weight: 600; margin:0; letter-spacing: 0.2px;
  }
  header.top .sub{ color: var(--ink-dim); font-size: 13px; margin-top: 4px; }

  nav.tabs{ display:flex; gap: 4px; }
  nav.tabs button{
    background:none; border:none; color: var(--ink-dim);
    font-size: 14px; padding: 8px 14px; cursor:pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active{ color: var(--gold); border-bottom-color: var(--gold); }
  nav.tabs button:hover{ color: var(--ink); }

  .status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .status-ok{ background: var(--green); }
  .status-bad{ background: var(--red); }
  .status-row{ font-size:12px; color: var(--ink-dim); display:flex; align-items:center; margin-top:4px; }

  .grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
  @media (max-width: 800px){ .grid{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .panel h2{ font-size: 15px; margin: 0 0 12px; color: var(--ink-dim); font-weight: 600; }

  .product-list{ display:flex; flex-direction:column; gap:1px; }
  .product-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 11px 4px; border-bottom: 1px solid var(--line);
    cursor:pointer;
  }
  .product-row:last-child{ border-bottom:none; }
  .product-row:hover{ background: var(--bg-panel-2); }
  .product-row .name{ font-size: 14.5px; }
  .product-row .meta{ font-size: 12px; color: var(--ink-dim); margin-top:2px; }
  .product-row .price{ font-size: 15px; color: var(--gold); }

  .cart-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0; border-bottom: 1px solid var(--line); gap:8px;
  }
  .cart-row .name{ font-size:14px; flex:1; }
  .qty-controls{ display:flex; align-items:center; gap:6px; }
  .qty-controls button{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--ink); cursor:pointer; font-size:13px; line-height:1;
  }
  .cart-total{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--gold-dim);
  }
  .cart-total .amt{ font-size: 24px; color: var(--gold); }

  button.primary{
    width:100%; margin-top:14px; padding: 11px; border:none; border-radius: var(--radius);
    background: var(--gold); color: #1B2A20; font-weight:600; font-size:14px; cursor:pointer;
  }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; }
  button.primary:hover:not(:disabled){ background:#E5C36B; }

  button.ghost{
    background:none; border:1px solid var(--line); color: var(--ink-dim);
    padding:7px 12px; border-radius: var(--radius); cursor:pointer; font-size:13px;
  }
  button.ghost:hover{ color: var(--ink); border-color: var(--ink-dim); }

  input, .field-input{
    width:100%; background: var(--bg); border:1px solid var(--line); color: var(--ink);
    padding: 9px 10px; border-radius: var(--radius); font-size: 14px; font-family: inherit;
  }
  input:focus{ outline:none; border-color: var(--gold-dim); }
  label{ font-size:12px; color: var(--ink-dim); display:block; margin-bottom:4px; }
  .field{ margin-bottom:12px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }

  .empty{ color: var(--ink-dim); font-size:13px; padding: 20px 4px; text-align:center; }

  .sale-row{
    padding: 12px 4px; border-bottom: 1px solid var(--line);
  }
  .sale-row .head{ display:flex; justify-content:space-between; font-size:14px; }
  .sale-row .items{ color: var(--ink-dim); font-size:12.5px; margin-top:4px; }
  .sale-row .amt{ color: var(--gold); }

  .toast{
    position: fixed; bottom: 20px; left:50%; transform: translateX(-50%);
    background: var(--bg-panel-2); border:1px solid var(--line); color: var(--ink);
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .toast.err{ border-color: var(--red); color: #F0B3AB; }

  .setup-note{
    font-size: 12.5px; color: var(--ink-dim); line-height:1.6; margin-top: 10px;
  }
  .setup-note code{
    background: var(--bg); padding: 1px 5px; border-radius: 2px; color: var(--gold);
  }
  a{ color: var(--gold); }

  .del-x{ color: var(--red); cursor:pointer; font-size:12px; margin-left:8px; }
  .icon-btn{ background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:16px; padding:2px 6px; }
  .icon-btn:hover{ color: var(--red); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const state = {
  tab: 'pos',
  supaUrl: '',
  supaKey: '',
  connected: false,
  products: [],
  cart: [], // {id, name, price, qty}
  sales: [],
  loading: false,
  toast: null,
  tendered: '',
  checkingOut: false,
};

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function showToast(msg, isErr){
  state.toast = {msg, isErr};
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 3200);
}

function money(n){
  return '\u20B1' + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function loadConfig(){
  try{
    const raw = localStorage.getItem('supabase-config');
    if(raw){
      const cfg = JSON.parse(raw);
      state.supaUrl = cfg.url || '';
      state.supaKey = cfg.key || '';
    }
  }catch(e){ /* no config yet */ }
}

async function saveConfig(){
  try{
    localStorage.setItem('supabase-config', JSON.stringify({url: state.supaUrl, key: state.supaKey}));
  }catch(e){ /* storage unavailable, config just won't persist */ }
}

function supaHeaders(){
  return {
    'apikey': state.supaKey,
    'Authorization': 'Bearer ' + state.supaKey,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}

async function testConnection(){
  if(!state.supaUrl || !state.supaKey){ state.connected = false; return; }
  try{
    const res = await fetch(`${state.supaUrl}/rest/v1/products?select=id&limit=1`, { headers: supaHeaders() });
    state.connected = res.ok;
  }catch(e){
    state.connected = false;
  }
}

async function fetchProducts(){
  if(!state.connected) return;
  state.loading = true; render();
  try{
    const res = await fetch(`${state.supaUrl}/rest/v1/products?select=*&order=name.asc`, { headers: supaHeaders() });
    if(!res.ok) throw new Error('Failed to load products');
    state.products = await res.json();
  }catch(e){
    showToast('Could not load products: ' + e.message, true);
  }
  state.loading = false; render();
}

async function fetchSales(){
  if(!state.connected) return;
  state.loading = true; render();
  try{
    const res = await fetch(`${state.supaUrl}/rest/v1/sales?select=*&order=created_at.desc&limit=50`, { headers: supaHeaders() });
    if(!res.ok) throw new Error('Failed to load sales');
    state.sales = await res.json();
  }catch(e){
    showToast('Could not load sales: ' + e.message, true);
  }
  state.loading = false; render();
}

async function addProduct(name, price, stock){
  try{
    const res = await fetch(`${state.supaUrl}/rest/v1/products`, {
      method:'POST', headers: supaHeaders(),
      body: JSON.stringify([{ name, price: Number(price), stock: Number(stock) }])
    });
    if(!res.ok) throw new Error('Insert failed');
    await fetchProducts();
    showToast('Product added.');
  }catch(e){
    showToast('Could not add product: ' + e.message, true);
  }
}

async function deleteProduct(id){
  try{
    const res = await fetch(`${state.supaUrl}/rest/v1/products?id=eq.${id}`, {
      method:'DELETE', headers: supaHeaders()
    });
    if(!res.ok) throw new Error('Delete failed');
    state.products = state.products.filter(p=>p.id!==id);
    render();
  }catch(e){
    showToast('Could not delete product: ' + e.message, true);
  }
}

function addToCart(product){
  const existing = state.cart.find(c=>c.id===product.id);
  if(existing){ existing.qty += 1; }
  else{ state.cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 }); }
  render();
}

function changeQty(id, delta){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ state.cart = state.cart.filter(c=>c.id!==id); }
  if(state.cart.length === 0){ state.tendered = ''; }
  render();
}

function cartTotal(){
  return state.cart.reduce((sum,c)=> sum + c.price*c.qty, 0);
}

function updateChangeDisplay(){
  const total = cartTotal();
  const tenderedNum = Number(state.tendered) || 0;
  const change = tenderedNum - total;
  const tenderedEntered = state.tendered !== '';
  const insufficientAmount = !tenderedEntered || tenderedNum < total;

  const changeEl = document.getElementById('change-amount');
  if(changeEl){
    changeEl.textContent = money(Math.max(change,0));
    changeEl.style.color = change < 0 ? 'var(--red)' : 'var(--green)';
  }
  const msgEl = document.getElementById('insufficient-msg');
  if(msgEl){
    msgEl.textContent = insufficientAmount ? (!tenderedEntered ? 'Enter the amount received before completing the sale.' : 'Amount received is less than the total.') : '';
  }
  const btn = document.getElementById('btn-checkout');
  if(btn){
    btn.disabled = insufficientAmount || state.checkingOut || state.cart.length===0;
  }
}

async function checkout(){
  if(state.cart.length===0) return;
  if(state.checkingOut) return; // prevent double-submit from fast/repeated taps
  const total = cartTotal();
  const tenderedNum = Number(state.tendered) || 0;
  if(state.tendered === '' || tenderedNum < total){
    showToast('Enter a valid amount received (must cover the total).', true);
    return;
  }
  state.checkingOut = true;
  render();
  const items = state.cart.map(c=>({ id:c.id, name:c.name, price:c.price, qty:c.qty }));
  try{
    const res = await fetch(`${state.supaUrl}/rest/v1/sales`, {
      method:'POST', headers: supaHeaders(),
      body: JSON.stringify([{ items, total }])
    });
    if(!res.ok) throw new Error('Checkout failed');

    for(const c of state.cart){
      const prod = state.products.find(p=>p.id===c.id);
      if(prod){
        const newStock = Math.max(0, (prod.stock||0) - c.qty);
        await fetch(`${state.supaUrl}/rest/v1/products?id=eq.${c.id}`, {
          method:'PATCH', headers: supaHeaders(),
          body: JSON.stringify({ stock: newStock })
        });
      }
    }
    state.cart = [];
    state.tendered = '';
    await fetchProducts();
    showToast('Sale recorded — ' + money(total));
  }catch(e){
    showToast('Checkout failed: ' + e.message, true);
  }
  state.checkingOut = false;
  render();
}

function renderSettings(){
  return `
  <div class="panel" style="max-width:520px;">
    <h2>Connect to Supabase</h2>
    <div class="field">
      <label>Project URL</label>
      <input id="in-url" placeholder="https://xxxx.supabase.co" value="${state.supaUrl}">
    </div>
    <div class="field">
      <label>Anon public key</label>
      <input id="in-key" placeholder="eyJhbGciOi..." value="${state.supaKey}">
    </div>
    <button class="primary" id="btn-connect" style="width:auto; padding:9px 18px;">Connect</button>
    <div class="status-row">
      <span class="status-dot ${state.connected?'status-ok':'status-bad'}"></span>
      ${state.connected ? 'Connected' : 'Not connected'}
    </div>
    <div class="setup-note">
      Run this once in your Supabase project's SQL editor to create the tables:
      <br><br>
      <code style="display:block; white-space:pre-wrap; padding:10px; margin-top:6px;">create table products (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  price numeric not null default 0,
  stock integer not null default 0,
  created_at timestamptz default now()
);

create table sales (
  id uuid primary key default gen_random_uuid(),
  items jsonb not null,
  total numeric not null,
  created_at timestamptz default now()
);

alter table products enable row level security;
alter table sales enable row level security;
create policy "anon full access" on products for all using (true) with check (true);
create policy "anon full access" on sales for all using (true) with check (true);</code>
      <br>
      Get your URL and anon key from Project Settings &rarr; API. The policies above allow open read/write with the anon key &mdash; fine for a personal or single-device POS, not for a public-facing app.
    </div>
  </div>`;
}

function renderPOS(){
  const rows = state.products.map(p => `
    <div class="product-row" data-id="${p.id}">
      <div>
        <div class="name">${p.name}</div>
        <div class="meta">${p.stock} in stock</div>
      </div>
      <div class="price mono">${money(p.price)}</div>
    </div>
  `).join('') || `<div class="empty">No products yet. Add some in the Products tab.</div>`;

  const cartRows = state.cart.map(c => `
    <div class="cart-row">
      <div class="name">${c.name}</div>
      <div class="qty-controls">
        <button data-dec="${c.id}">\u2212</button>
        <span class="mono">${c.qty}</span>
        <button data-inc="${c.id}">+</button>
      </div>
      <div class="mono" style="width:70px; text-align:right;">${money(c.price*c.qty)}</div>
    </div>
  `).join('') || `<div class="empty">Cart is empty. Tap a product to add it.</div>`;

  const total = cartTotal();
  const tenderedNum = Number(state.tendered) || 0;
  const change = tenderedNum - total;
  const hasCart = state.cart.length > 0;
  const tenderedEntered = state.tendered !== '';
  const insufficientAmount = hasCart && (!tenderedEntered || tenderedNum < total);
  const canCheckout = hasCart && !state.checkingOut && !insufficientAmount;

  return `
  <div class="grid">
    <div class="panel">
      <h2>Products</h2>
      <div class="product-list">${rows}</div>
    </div>
    <div class="panel">
      <h2>Current sale</h2>
      <div>${cartRows}</div>
      <div class="cart-total">
        <span>Total</span>
        <span class="amt mono">${money(total)}</span>
      </div>
      ${hasCart ? `
      <div class="field" style="margin-top:14px;">
        <label>Amount received</label>
        <input id="in-tendered" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${state.tendered}">
      </div>
      <div class="cart-total" style="border-top:none; padding-top:0; margin-top:0;">
        <span>Change (sukli)</span>
        <span class="amt mono" id="change-amount" style="color:${change < 0 ? 'var(--red)' : 'var(--green)'};">${money(Math.max(change,0))}</span>
      </div>
      <div id="insufficient-msg" style="color:var(--red); font-size:12.5px; margin-top:8px;">${insufficientAmount ? (!tenderedEntered ? 'Enter the amount received before completing the sale.' : 'Amount received is less than the total.') : ''}</div>
      ` : ''}
      <button class="primary" id="btn-checkout" ${!canCheckout?'disabled':''}>${state.checkingOut ? 'Saving...' : 'Complete sale'}</button>
    </div>
  </div>`;
}

function renderProducts(){
  const rows = state.products.map(p => `
    <div class="product-row">
      <div>
        <div class="name">${p.name}</div>
        <div class="meta">${p.stock} in stock</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="price mono">${money(p.price)}</div>
        <button class="icon-btn" data-del="${p.id}" title="Delete">\u2715</button>
      </div>
    </div>
  `).join('') || `<div class="empty">No products yet.</div>`;

  return `
  <div class="grid">
    <div class="panel">
      <h2>Add a product</h2>
      <div class="field">
        <label>Name</label>
        <input id="np-name" placeholder="e.g. Band shirt">
      </div>
      <div class="row2">
        <div class="field">
          <label>Price</label>
          <input id="np-price" type="number" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label>Stock</label>
          <input id="np-stock" type="number" placeholder="0">
        </div>
      </div>
      <button class="primary" id="btn-add-product">Add product</button>
    </div>
    <div class="panel">
      <h2>All products</h2>
      <div class="product-list">${rows}</div>
    </div>
  </div>`;
}

function renderHistory(){
  const rows = state.sales.map(s => {
    const d = new Date(s.created_at);
    const itemsStr = (s.items||[]).map(i=>`${i.qty}\u00D7 ${i.name}`).join(', ');
    return `
    <div class="sale-row">
      <div class="head">
        <span>${d.toLocaleString()}</span>
        <span class="amt mono">${money(s.total)}</span>
      </div>
      <div class="items">${itemsStr}</div>
    </div>`;
  }).join('') || `<div class="empty">No sales yet.</div>`;

  return `<div class="panel">${rows}</div>`;
}

function render(){
  const app = document.getElementById('app');
  let body;
  if(!state.connected){
    body = renderSettings();
  } else if(state.tab === 'pos'){
    body = renderPOS();
  } else if(state.tab === 'products'){
    body = renderProducts();
  } else if(state.tab === 'settings'){
    body = renderSettings();
  } else {
    body = renderHistory();
  }

  app.innerHTML = `
    <header class="top">
      <div>
        <h1 class="serif">CCFACO POS</h1>
        <div class="sub">Sales sync to your Supabase project</div>
      </div>
      ${state.connected ? `
      <nav class="tabs">
        <button data-tab="pos" class="${state.tab==='pos'?'active':''}">Sell</button>
        <button data-tab="products" class="${state.tab==='products'?'active':''}">Products</button>
        <button data-tab="history" class="${state.tab==='history'?'active':''}">History</button>
        <button data-tab="settings" class="${state.tab==='settings'?'active':''}">Settings</button>
      </nav>` : ''}
    </header>
    ${body}
    ${state.toast ? `<div class="toast ${state.toast.isErr?'err':''}">${state.toast.msg}</div>` : ''}
  `;

  // wire events
  app.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.tab = b.dataset.tab; render();
      if(state.tab==='history') fetchSales();
    });
  });

  const connectBtn = document.getElementById('btn-connect');
  if(connectBtn){
    connectBtn.addEventListener('click', async ()=>{
      state.supaUrl = document.getElementById('in-url').value.trim().replace(/\/$/,'');
      state.supaKey = document.getElementById('in-key').value.trim();
      await saveConfig();
      await testConnection();
      if(state.connected){
        state.tab = 'pos';
        await fetchProducts();
        showToast('Connected to Supabase.');
      } else {
        showToast('Could not connect — check your URL and key.', true);
      }
      render();
    });
  }

  app.querySelectorAll('.product-row[data-id]').forEach(r=>{
    r.addEventListener('click', ()=>{
      const p = state.products.find(x=>x.id===r.dataset.id);
      if(p) addToCart(p);
    });
  });

  app.querySelectorAll('[data-inc]').forEach(b=> b.addEventListener('click', ()=> changeQty(b.dataset.inc, 1)));
  app.querySelectorAll('[data-dec]').forEach(b=> b.addEventListener('click', ()=> changeQty(b.dataset.dec, -1)));

  const checkoutBtn = document.getElementById('btn-checkout');
  if(checkoutBtn) checkoutBtn.addEventListener('click', checkout);

  const tenderedInput = document.getElementById('in-tendered');
  if(tenderedInput){
    tenderedInput.addEventListener('input', ()=>{
      state.tendered = tenderedInput.value;
      updateChangeDisplay();
    });
  }

  const addProdBtn = document.getElementById('btn-add-product');
  if(addProdBtn){
    addProdBtn.addEventListener('click', async ()=>{
      const name = document.getElementById('np-name').value.trim();
      const price = document.getElementById('np-price').value;
      const stock = document.getElementById('np-stock').value || 0;
      if(!name || !price){ showToast('Enter a name and price.', true); return; }
      await addProduct(name, price, stock);
    });
  }

  app.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', (ev)=>{ ev.stopPropagation(); deleteProduct(b.dataset.del); });
  });
}

async function init(){
  await loadConfig();
  await testConnection();
  if(state.connected){
    await fetchProducts();
  }
  render();
}

init();
</script>
</body>
</html>
